services:
  backend:
    build: .
    container_name: users_backend
    command: >
      sh -c "sleep 10 && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - shared_net
    volumes:
      - ".:/app"

networks:
  shared_net:
    external: true
